<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>创建新活动 - 幸运抽卡</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        theme: {
          extend: {

                    "on-background": "#1c1b1b",
                    "tertiary-fixed-dim": "#cac99f",

                    "tertiary": "#60603e",
                    "surface-container-low": "#f6f3f2",
                    "secondary-fixed-dim": "#fbbc00",
                    "on-error": "#ffffff",
                    "error": "#ba1a1a",
                    "on-surface": "#1c1b1b",
                    "on-primary": "#ffffff",
                    "secondary-fixed": "#ffdfa0",
                    "tertiary-container": "#dedcb1",
                    "on-secondary-container": "#6d5000",
                    "primary-fixed": "#ffe16d",
                    "on-tertiary-fixed-variant": "#484828",
                    "on-secondary": "#ffffff",
                    "surface": "#fcf9f8",
                    "on-primary-fixed": "#221b00",
                    "background": "#fcf9f8",
                    "secondary-container": "#ffbf00",
                    "on-primary-container": "#705e00",
                    "surface-container-high": "#eae7e7",
                    "tertiary-fixed": "#e6e5b9",
                    "on-error-container": "#93000a",
                    "surface-dim": "#dcd9d9",
                    "surface-bright": "#fcf9f8",
                    "on-secondary-fixed": "#261a00",
                    "on-tertiary": "#ffffff",

                    "surface-container-lowest": "#ffffff",
                    "inverse-on-surface": "#f3f0ef",
                    "on-secondary-fixed-variant": "#5c4300",
                    "outline-variant": "#d0c6ab",
                    "inverse-primary": "#e9c400",
                    "on-primary-fixed-variant": "#544600",
                    "surface-variant": "#e5e2e1",
                    "inverse-surface": "#313030",
                    "surface-container-highest": "#e5e2e1",
                    "outline": "#7e775f",
                    "primary-container": "#ffd700",
                    "primary": "#705d00",
                    "surface-container": "#f0eded",
                    "surface-tint": "#705d00",

            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",

                    "full": "9999px"
            },
            "spacing": {
                    "unit": "4px",
                    "gutter": "12px",
                    "section-margin": "32px",
                    "container-padding": "20px",
                    "card-gap": "16px"
            },
            "fontFamily": {
                    "body-lg": ["Plus Jakarta Sans"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "label-sm": ["Plus Jakarta Sans"],
                    "headline-lg-mobile": ["Plus Jakarta Sans"],
                    "title-md": ["Plus Jakarta Sans"],
                    "display-lg": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],

                    "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800"}]
            }
          },
        },
      }

<style>
        body {
            background-color: #fcf9f8;
            color: #1c1b1b;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            background: radial-gradient(circle at top left, #fff9e6 0%, #fcf9f8 50%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(255, 191, 0, 0.05);
        }

        .pill-button-primary {
            background: #FFD700;
            color: #221b00;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4), 0 4px 15px rgba(255, 215, 0, 0.3);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .pill-button-primary:active {
            transform: scale(0.95);
        }

        .input-glass {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            transition: border-color 0.3s ease;
        }

        .input-glass:focus {
            outline: none;
            border-color: #FFD700;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #FFD700;
            border-radius: 10px;
        }

        .orb-highlight {
            background: radial-gradient(circle at 30% 30%, #FFD700, #FFBF00);
            position: relative;
        }
        .orb-highlight::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 20%;
            width: 30%;
            height: 20%;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: rotate(-30deg);
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="min-h-screen pb-32">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-white/15 backdrop-blur-xl border-b border-white/20 shadow-[0_4px_30px_rgba(0,0,0,0.1)] h-16 flex items-center justify-between px-container-padding">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 active:scale-95 transition-all">
<span class="material-symbols-outlined text-primary text-[24px]">arrow_back</span>
</button>
<h1 class="font-title-md text-title-md text-primary">创建新活动</h1>
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center overflow-hidden border border-white/30">
<img class="w-full h-full object-cover" data-alt="A warm and friendly profile avatar of a creative digital designer in a soft focus yellow-themed studio, high-end illustration style, modern and clean aesthetics." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDMJ1E9cQjHaiMoZlwN8DESg_WE6kjsv-9Jly_-swKjGdfqaKSD90UerfCdrPpkTdfAAylnTdSOFeMnUonybjLbGsnthtF2xvvlUxZYqGku14s4uGMZXyYFaFx0IEp-MWQoeEy-lpSRikhyJgS8-nMTSkphI2cx2YICZegalqtGRGt5HOO4LzXlDxYvRogG-gsfgiGNhonT_CmOzXaykqNF5l8KGYjufbhlL0Ywmb67bckDIXyWLMEF"/>
</div>
</header>
<main class="mt-20 px-container-padding space-y-section-margin">
<!-- Section 1: Basic Info -->
<section class="space-y-gutter">
<label class="block font-label-sm text-on-surface-variant px-1">活动信息</label>
<div class="glass-card rounded-lg p-container-padding">
<div class="space-y-2">
<span class="text-label-sm text-on-surface-variant block"><span class="material-symbols-outlined text-primary text-sm align-middle mr-1">local_activity</span>活动名称</span>
<input class="input-glass w-full rounded-full px-4 py-3 font-body-lg text-on-surface" placeholder="输入响亮的活动标题..." type="text"/>
</div>
</div>
</section>
<!-- Section 2: Upload Prizes -->
<section class="space-y-gutter">
<label class="block font-label-sm text-on-surface-variant px-1">奖品列表</label>
<div class="space-y-card-gap">
<!-- Prize Item Template 1 -->
<div class="glass-card rounded-lg p-container-padding flex gap-4 items-start">
<div class="w-24 h-24 rounded-lg bg-white/40 border-2 border-dashed border-white/60 flex flex-col items-center justify-center cursor-pointer shrink-0">
<span class="material-symbols-outlined text-primary mb-1">add_photo_alternate</span>
<span class="text-[10px] text-primary font-bold">上传图片</span>
</div>
<div class="flex-1 space-y-2">
<span class="text-label-sm text-on-surface-variant block"><span class="material-symbols-outlined text-primary text-sm align-middle mr-1">edit</span>奖品名称</span>
<input class="input-glass w-full rounded-full px-4 py-2 font-body-lg text-on-surface text-sm" placeholder="例如：限量款潮玩" type="text"/>
</div>
</div>
<!-- Prize Item Template 2 -->
<div class="glass-card rounded-lg p-container-padding flex gap-4 items-start">
<div class="w-24 h-24 rounded-lg bg-white/40 border-2 border-dashed border-white/60 flex flex-col items-center justify-center cursor-pointer shrink-0">
<span class="material-symbols-outlined text-primary mb-1">add_photo_alternate</span>
<span class="text-[10px] text-primary font-bold">上传图片</span>
</div>
<div class="flex-1 space-y-2">
<span class="text-label-sm text-on-surface-variant block"><span class="material-symbols-outlined text-primary text-sm align-middle mr-1">edit</span>奖品名称</span>
<input class="input-glass w-full rounded-full px-4 py-2 font-body-lg text-on-surface text-sm" placeholder="例如：品牌耳机" type="text"/>
</div>
</div>
<!-- Add More Button -->
<button class="w-full py-4 rounded-full border-2 border-dashed border-primary/30 flex items-center justify-center gap-2 text-primary font-bold hover:bg-primary/5 transition-colors bg-primary/5">
<span class="material-symbols-outlined">add_circle</span>
<span class="text-label-sm">添加更多奖品</span>
</button>
</div>
</section>
<!-- Tips Section -->
<section class="glass-card rounded-lg p-4 bg-primary-container/10 border-primary/20 flex items-start gap-3">
<span class="material-symbols-outlined text-primary">lightbulb</span>
<p class="text-label-sm text-on-surface-variant leading-relaxed">
<span class="font-bold text-primary">贴士：</span> 为每个奖品上传一张精美的实拍图，可以极大地提高用户的参与热情。
            </p>
</section>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full px-container-padding py-6 bg-white/10 backdrop-blur-2xl border-t border-white/30 z-50">
<button class="pill-button-primary w-full h-14 rounded-full flex items-center justify-center gap-3 active:scale-95 transition-transform">
<span class="font-title-md text-title-md">完成并保存</span>
<span class="material-symbols-outlined">check_circle</span>
</button>
</div>
<!-- Background Atmospheric Effect -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute top-[10%] left-[-15%] w-[60%] aspect-square bg-primary/10 blur-[100px] rounded-full"></div>
<div class="absolute bottom-[20%] right-[-15%] w-[50%] aspect-square bg-secondary-container/15 blur-[120px] rounded-full"></div>
<div class="absolute top-[40%] right-[10%] w-[40%] aspect-square bg-primary-container/20 blur-[130px] rounded-full"></div></div>
<script>
        // Interaction logic for visual feedback
        document.querySelectorAll('.glass-card, button').forEach(el => {
            el.addEventListener('touchstart', () => {
                el.style.transform = 'scale(0.98)';
            });
            el.addEventListener('touchend', () => {
                el.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
