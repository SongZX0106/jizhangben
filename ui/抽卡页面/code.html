<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.4);
            --gold-glow: rgba(255, 191, 0, 0.3);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fcf9f8;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            backdrop-filter: blur(20px);
            background: var(--glass-bg);
            border: 1.5px solid var(--glass-border);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
        .gold-pulse {
            animation: pulse-glow 3s infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px var(--gold-glow); }
            50% { box-shadow: 0 0 50px rgba(255, 215, 0, 0.6); }
        }
        .bokeh {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            opacity: 0.6;
        }
        .draw-button-gradient {
            background: linear-gradient(180deg, #FFD700 0%, #FFBF00 100%);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.5), 0 10px 20px rgba(121, 89, 0, 0.2);
        }
    </style>

                        "secondary-fixed": "#ffdfa0",
                        "on-secondary-fixed-variant": "#5c4300",
                        "surface-container-high": "#eae7e7",
                        "on-surface": "#1c1b1b",
                        "on-tertiary": "#ffffff",
                        "outline": "#7e775f",
                        "tertiary-fixed": "#e6e5b9",

                        "surface-bright": "#fcf9f8",

                    "spacing": {
                        "gutter": "12px",

                        "section-margin": "32px",
                        "card-gap": "16px"

                    "fontFamily": {
                        "title-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],

                        "headline-lg-mobile": ["Plus Jakarta Sans"]

                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],

<body class="flex flex-col min-h-screen">
<!-- Background Atmospheric Elements -->

<div class="bokeh bg-primary-fixed w-[400px] h-[400px] top-[-100px] left-[-100px]"></div>
<div class="bokeh bg-secondary-container w-[300px] h-[300px] bottom-[10% ] right-[-50px]"></div>
<div class="bokeh bg-tertiary-fixed w-[250px] h-[250px] top-[40%] left-[20%] opacity-30"></div>

<!-- Top App Bar -->

</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center pt-24 pb-32 px-container-padding relative overflow-hidden">
<!-- Activity Info -->
<div class="text-center mb-8 space-y-2 z-10">
<div class="inline-block px-4 py-1 rounded-full bg-primary-container/30 border border-primary/20 mb-2">

<!-- Central Mystery Box (Hero Element) -->

<!-- Glow layers -->
<div class="absolute inset-0 gold-pulse rounded-lg bg-primary-container/10 filter blur-3xl scale-110"></div>
<!-- Floating Glass Card -->
<div class="glass-card w-full h-full rounded-lg animate-float flex flex-col items-center justify-center p-8 relative overflow-hidden shadow-2xl">
<!-- Inner decoration -->
<div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-white/10 to-transparent pointer-events-none"></div>
<div class="relative z-10 flex flex-col items-center">
<!-- Gacha Orb Visual -->
<div class="w-40 h-40 rounded-full bg-gradient-to-tr from-secondary-container to-primary-container relative shadow-inner mb-6">
<div class="absolute inset-0 rounded-full" style="background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6) 0%, transparent 60%);"></div>
<div class="absolute top-4 left-6 w-12 h-6 bg-white/40 rounded-[100%] blur-[2px] rotate-[-25deg]"></div>
<div class="w-full h-full flex items-center justify-center">

</div>
</div>
<div class="text-center space-y-1">
<p class="font-title-md text-title-md text-primary">幸运宝箱</p>
<p class="font-label-sm text-label-sm text-on-surface-variant opacity-70">LUCKY BOX #2024</p>
</div>
</div>
<!-- Abstract particle-like elements -->
<div class="absolute bottom-4 right-4 w-12 h-12 border border-white/20 rounded-full opacity-40"></div>
<div class="absolute top-10 left-10 w-4 h-4 bg-white/30 rounded-full blur-sm"></div>
</div>
</div>
<!-- Draw Button Section -->
<div class="fixed bottom-24 left-0 w-full px-container-padding flex flex-col items-center gap-4 z-20">
<button class="draw-button-gradient w-full max-w-sm py-4 rounded-full font-headline-lg-mobile text-headline-lg-mobile text-on-primary-fixed active:scale-90 transition-transform duration-200">
                开始抽卡
            </button>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" data-icon="account_balance_wallet">account_balance_wallet</span>

<span class="text-on-surface-variant/40 mx-2">|</span>

</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-white/10 dark:bg-black/20 backdrop-blur-2xl border-t border-white/30 shadow-[0_-8px_32px_rgba(255,191,0,0.15)] flex justify-around items-center px-4 py-3 pb-safe">

</div>
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-6 py-1 active:scale-90 transition-transform cursor-pointer shadow-md">

<span class="font-label-sm text-label-sm">抽卡</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-white/20 transition-colors rounded-xl px-4 py-1 cursor-pointer">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-sm text-label-sm">历史</span>
</div>

<!-- Micro-interaction Scripts -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const drawBtn = document.querySelector('.draw-button-gradient');
            const box = document.querySelector('.animate-float');
            
            drawBtn.addEventListener('click', () => {
                // Simulate draw animation
                box.classList.remove('animate-float');
                box.style.transition = 'all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                box.style.transform = 'scale(1.2) rotate(10deg)';
                
                setTimeout(() => {
                    box.style.transform = 'scale(1) rotate(0deg)';
                    setTimeout(() => {
                        box.classList.add('animate-float');
                        // Show result feedback (simple alert for demo)
                        // In a real app, this would trigger the reward reveal UI
                    }, 500);
                }, 200);
            });

            // Random bokeh movement
            const bokehs = document.querySelectorAll('.bokeh');
            bokehs.forEach(bokeh => {
                const animateBokeh = () => {
                    const x = (Math.random() - 0.5) * 100;
                    const y = (Math.random() - 0.5) * 100;
                    bokeh.style.transition = 'transform 10s ease-in-out';
                    bokeh.style.transform = `translate(${x}px, ${y}px)`;
                };
                setInterval(animateBokeh, 10000);
                animateBokeh();
            });
        });
    </script>
</body></html>
