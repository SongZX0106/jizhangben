<style>
        body {

        .glass-card {

            border: 1.5px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(255, 191, 0, 0.05);

        .pill-button-primary {
            background: #FFD700;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4), 0 4px 12px rgba(255, 215, 0, 0.3);
            transition: all 0.2s ease;
        }

        .pill-button-primary:active {
            transform: scale(0.95);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.2), 0 2px 6px rgba(255, 215, 0, 0.2);
        }

        .gacha-orb {
            background: radial-gradient(circle at 30% 30%, #FFD700, #FFBF00);
            position: relative;
            overflow: hidden;
        }

        .gacha-orb::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 15%;
            width: 40%;
            height: 20%;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: rotate(-25deg);
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<script>
        // Micro-interaction for cards
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                // Potential subtle haptic or sound trigger if on native bridge
            });
        });

        // Simple smooth scroll and FAB toggle logic can be added here
        let lastScrollY = window.scrollY;
        const fab = document.querySelector('button.fixed.bottom-24');
        
        window.addEventListener('scroll', () => {
            if (window.scrollY > lastScrollY && window.scrollY > 100) {
                fab.style.transform = 'translateY(120px) scale(0.5)';
                fab.style.opacity = '0';
            } else {
                fab.style.transform = 'translateY(0) scale(1)';
                fab.style.opacity = '1';
            }
            lastScrollY = window.scrollY;
        }, { passive: true });
    </script>
